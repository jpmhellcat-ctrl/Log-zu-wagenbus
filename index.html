<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log zu PRO.CSV Konverter</title>
    
    <!-- Lade Tailwind CSS für modernes, responsives Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lade die "Inter" Schriftart für ein klares Schriftbild -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Eigene Scrollbar für den Preview-Bereich */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans selection:bg-indigo-100 selection:text-indigo-900">

    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden transition-all">
        
        <!-- Header Bereich -->
        <div class="bg-slate-900 px-8 py-10 text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500 via-transparent to-transparent"></div>
            <div class="relative z-10">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-200 mb-4 border border-indigo-500/30">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Version 3.1 (Monitor-Format VDV/IBIS)
                </span>
                <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2 tracking-tight">Log <span class="text-indigo-400">➔</span> PRO.CSV</h1>
                <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                    Wandle Roh-Logs in das exakte Spaltenstruktur-Format des Wagenbusmonitors um – inkl. Hex-Spacing und echter Zeilenumbrüche für Steuerzeichen.
                </p>
            </div>
        </div>

        <div class="p-6 sm:p-8">
            <!-- Drag & Drop Zone -->
            <label id="drop-zone" class="relative flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 transition-all cursor-pointer group mb-6">
                <input type="file" id="fileInput" accept=".log,.txt" class="hidden">
                
                <div class="flex flex-col items-center justify-center pt-5 pb-6 pointer-events-none" id="upload-content">
                    <div class="p-4 bg-white rounded-full shadow-sm mb-3 group-hover:scale-110 group-hover:shadow-md transition-transform duration-300">
                        <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <p class="mb-1 text-sm text-slate-600 font-medium" id="drop-text-main"><span class="font-semibold text-indigo-600">Klicke hier</span>, um eine Datei auszuwählen</p>
                    <p class="text-xs text-slate-400" id="drop-text-sub">oder ziehe sie per Drag & Drop hierher (.log, .txt)</p>
                </div>
            </label>

            <!-- Aktionen -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                
                <!-- Download Bereich -->
                <button id="downloadBtn" disabled class="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 disabled:from-slate-300 disabled:to-slate-300 disabled:cursor-not-allowed text-white font-medium py-3.5 px-4 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-indigo-100 outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Als .PRO.CSV speichern
                </button>

                <!-- Testdaten Bereich -->
                <div class="flex gap-2 w-full">
                    <div class="relative flex-1">
                        <select id="testDataSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 text-slate-700 rounded-xl pl-4 pr-10 py-3.5 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all font-medium cursor-pointer h-full">
                            <option value="ds003a">DS003a (Linie/Ziel)</option>
                            <option value="ds021">DS021 (Text/Fahrweg)</option>
                            <option value="ds021a">DS021a (Streckenverlauf)</option>
                            <option value="ds021c">DS021c (Innenanzeige)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    
                    <button id="generateTestBtn" class="flex-none flex items-center justify-center bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-5 py-3.5 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-emerald-100 outline-none tooltip" title="Testdaten generieren">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Preview Box (Versteckt bis Daten da sind) -->
            <div id="preview-container" class="hidden mt-2">
                <div class="flex items-center justify-between mb-2 px-1">
                    <h3 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Vorschau (Erste Zeilen)
                    </h3>
                    <span id="preview-filename" class="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-1 rounded"></span>
                </div>
                <div id="preview" class="bg-[#1e293b] text-[#e2e8f0] p-4 rounded-xl font-mono text-sm leading-relaxed overflow-y-auto max-h-64 shadow-inner border border-slate-700 whitespace-pre-wrap"></div>
            </div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const dropTextMain = document.getElementById('drop-text-main');
        const dropTextSub = document.getElementById('drop-text-sub');
        const uploadContent = document.getElementById('upload-content');
        const downloadBtn = document.getElementById('downloadBtn');
        const generateTestBtn = document.getElementById('generateTestBtn');
        const testDataSelect = document.getElementById('testDataSelect');
        const previewContainer = document.getElementById('preview-container');
        const preview = document.getElementById('preview');
        const previewFilename = document.getElementById('preview-filename');
        
        let csvContent = "";
        let originalFileName = "";

        // VDV/IBIS Telegram Map basierend auf deinen Vorlagen
        const telegramMap = {
            'l': { id: '001', desc: 'AD Liniennummer' },
            'k': { id: '002', desc: 'Außenanzeigen AD Kursnummer' },
            'z': { id: '003', desc: 'Außenanzeigen AD Zielnummer' },
            'e': { id: '004', desc: 'Entwertermerkmale' },
            'u': { id: '005', desc: 'Entwerter AD Uhrzeit' },
            'd': { id: '006', desc: 'Entwerter AD Kalender-Datum' },
            'a': { id: '020', desc: 'Anzeigen Status-Abfrage' },
            'v': { id: '009b', desc: 'Voranzeige, Innenanzeige AD Haltestellen-Name' },
            'x': { id: '010b', desc: 'Verlaufsanzeige Verlaufsanzeige Haltestellenindex' },
            'aL': { id: '021a', desc: 'Streckenverlaufsanzeigen Übertragung Haltestellenname und Umsteigehinweise' },
            'aA': { id: '[021]', desc: 'Anzeigen Text Ziel, Fahrweg' },
            'lE': { id: '001a', desc: 'Liniennummer-Anzeiger AD Sonder-Anzeige' }
        };

        // File Input Event
        fileInput.addEventListener('change', handleFile);
        
        // Drag & Drop Events mit Tailwind Klassen-Toggling für visuelles Feedback
        dropZone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            dropZone.classList.add('bg-indigo-50', 'border-indigo-500');
            dropZone.classList.remove('bg-slate-50', 'border-slate-300');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-indigo-50', 'border-indigo-500');
            dropZone.classList.add('bg-slate-50', 'border-slate-300');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-indigo-50', 'border-indigo-500');
            dropZone.classList.add('bg-slate-50', 'border-slate-300');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        // Testdaten-Generator
        generateTestBtn.addEventListener('click', () => {
            const selectedDS = testDataSelect.value;
            originalFileName = `Testdaten_${selectedDS.toUpperCase()}.log`;
            
            let fakeLogLines = [];
            switch(selectedDS) {
                case 'ds003a':
                    fakeLogLines = [
                        "2026/09/07 12:00:00.000 6C3030300D2E", // l000
                        "2026/09/07 12:00:00.500 6430343039360D2D", // d04096
                        "2026/09/07 12:00:01.000 75313035360D05", // u1056
                        "2026/09/07 12:00:01.500 7A323435300D0B", // z2450
                        "2026/09/07 12:00:02.000 7A493553697373616368204261686E686F6620202020200D60", // zI Sissach Bahnhof
                        "2026/09/07 12:00:02.500 7A4134457074696E67656E0A457074696E67656E0A457074696E67656E0A457074696E67656E0A2E4446364446364446364446362020202020202020202020202020200D73", // zA Eptingen
                        "2026/09/07 12:00:03.000 7A4E3030300D76" // zN000
                    ];
                    break;
                case 'ds021':
                    fakeLogLines = [
                        "2026/09/07 12:05:00.000 614131334765736368657220202020202020202020202020202020202020202020202020200A2E00000000202020202020202020200D19", // aA13Gescher
                        "2026/09/07 12:05:01.000 614132334765736368657220202020202020202020202020202020202020202020202020200A2E00000000202020202020202020200D1A"  // aA23Gescher
                    ];
                    break;
                case 'ds021a':
                    fakeLogLines = [
                        "2026/09/07 12:10:00.000 614C34323B033031042020202020202020202020202020202020202005202020202020202020202020202020202020200D61", // aL42; Platzhalter
                        "2026/09/07 12:10:01.000 614C34303E0330310447796D6E617369756D050D38", // aL40> Gymnasium
                        "2026/09/07 12:10:02.000 614C3431340330320445737465726E2047656C6467617474050D59", // aL414 Estern Geldgatt
                        "2026/09/07 12:10:03.000 784930310D42" // xI01 (Haltestellenindex)
                    ];
                    break;
                case 'ds021c':
                    fakeLogLines = [
                        "2026/09/07 12:15:00.000 7647796D6E617369756D2020202020202020202020202020200D7A", // vGymnasium (Innenanzeige)
                        "2026/09/07 12:15:01.000 614C34303503393904050D6C", // aL405
                        "2026/09/07 12:15:02.000 614C34313503313004476573636865722C2052617468617573050D65" // aL415 Gescher, Rathaus
                    ];
                    break;
            }
            
            processLog(fakeLogLines.join('\n'));
            updateUIForSuccess(`Testdaten ${selectedDS.toUpperCase()}`);
        });

        function handleFile() {
            if (fileInput.files.length === 0) return;
            
            const file = fileInput.files[0];
            originalFileName = file.name;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                processLog(text);
                updateUIForSuccess(originalFileName);
            };
            
            reader.readAsText(file);
        }

        function updateUIForSuccess(filename) {
            // Zeige Erfolgs-Design im Drop-Bereich
            dropZone.classList.add('border-emerald-400', 'bg-emerald-50');
            uploadContent.innerHTML = `
                <div class="p-3 bg-emerald-100 rounded-full shadow-sm mb-3">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <p class="mb-1 text-sm text-emerald-800 font-semibold">Konvertierung erfolgreich!</p>
                <p class="text-xs text-emerald-600 truncate max-w-xs px-4" title="${filename}">${filename}</p>
            `;
            
            // UI freischalten
            downloadBtn.disabled = false;
            previewContainer.classList.remove('hidden');
            previewFilename.textContent = filename;
            
            // Setze nach 3 Sekunden auf Standard zurück, damit man optisch erneut Dateien reinziehen kann
            setTimeout(() => {
                if(dropZone.classList.contains('border-emerald-400')) {
                    dropZone.classList.remove('border-emerald-400', 'bg-emerald-50');
                    uploadContent.innerHTML = `
                        <div class="p-4 bg-white rounded-full shadow-sm mb-3 group-hover:scale-110 group-hover:shadow-md transition-transform duration-300">
                            <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <p class="mb-1 text-sm text-slate-600 font-medium" id="drop-text-main"><span class="font-semibold text-indigo-600">Klicke hier</span>, um eine neue Datei auszuwählen</p>
                        <p class="text-xs text-slate-400" id="drop-text-sub">oder ziehe sie per Drag & Drop hierher</p>
                    `;
                }
            }, 4000);
        }

        // Helfer für Telegramm-Typ
        function getTelegramInfo(asciiStr) {
            let typeId = "";
            let desc = "";
            
            if (asciiStr.startsWith('aA')) { typeId = '[021]'; desc = 'Anzeigen Text Ziel, Fahrweg'; }
            else if (asciiStr.startsWith('aL')) { typeId = '021a'; desc = 'Streckenverlaufsanzeigen Übertragung Haltestellenname und Umsteigehinweise'; }
            else if (asciiStr.startsWith('lE')) { typeId = '001a'; desc = 'Liniennummer-Anzeiger AD Sonder-Anzeige'; }
            else if (asciiStr.startsWith('zA')) { typeId = '022'; desc = 'Zusatzanzeige'; }
            else {
                const firstChar = asciiStr.charAt(0);
                if (telegramMap[firstChar]) {
                    typeId = telegramMap[firstChar].id;
                    desc = telegramMap[firstChar].desc;
                }
            }
            return { typeId, desc };
        }

        // Haupt-Verarbeitungslogik (Byte für Byte aus Hex)
        function processLog(text) {
            const lines = text.split(/\r?\n/);
            let csvRows = [];
            let previewText = "";
            let rowIndex = 1;
            let baseTick = 50619076; 
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const parts = line.split(' ');
                if (parts.length >= 3) {
                    const rawHex = parts[2];
                    
                    let formattedHex = " ";
                    for(let j=0; j < rawHex.length; j+=2) {
                        formattedHex += rawHex.substring(j, j+2) + " ";
                    }
                    formattedHex = formattedHex.trimRight();
                    
                    let exactAscii = "";
                    for(let j=0; j < rawHex.length; j+=2) {
                        const byteVal = parseInt(rawHex.substring(j, j+2), 16);
                        // Erzeuge echtes Line Feed oder Carriage Return, wo nötig.
                        if (byteVal === 0x0D) {
                            exactAscii += '\n'; // Wagenbusmonitor erwartet echten Zeilenumbruch hier
                        } else if (byteVal === 0x0A) {
                            exactAscii += '\n'; 
                        } else {
                            exactAscii += String.fromCharCode(byteVal);
                        }
                    }
                    
                    const tInfo = getTelegramInfo(exactAscii);
                    
                    const escapeCsv = (str) => '"' + str.replace(/"/g, '""') + '"';
                    
                    let col1 = '"M"';
                    let col2 = `"${rowIndex}"`;
                    let col3 = `"${baseTick}"`;
                    let col4 = '""';
                    let col5 = '""';
                    if (tInfo.typeId === '[021]') col5 = '"X"'; 
                    
                    let col6 = escapeCsv(exactAscii);
                    let col7 = escapeCsv(formattedHex);
                    let col8 = `"${tInfo.typeId}"`;
                    let col9 = `"${tInfo.desc}"`;
                    let col10 = '""';
                    
                    if (tInfo.typeId === '[021]' || tInfo.typeId === '020' || tInfo.typeId === '021a') col10 = '"-1"';
                    
                    const csvLine = [col1, col2, col3, col4, col5, col6, col7, col8, col9, col10].join(';');
                    csvRows.push(csvLine);
                    
                    if (rowIndex <= 5) {
                        // Verschönere die Vorschau-Ausgabe, damit Zeilenumbrüche sichtbar, aber nicht kaputt sind
                        const previewSafeAscii = exactAscii.replace(/\n/g, '↵');
                        previewText += `<span class="text-indigo-400">Zeile ${rowIndex}</span> │ <span class="text-emerald-400">${tInfo.desc || 'Unbekannt'}</span>\n<span class="text-slate-500">Hex:</span> ${formattedHex}\n<span class="text-slate-500">Ascii:</span> ${previewSafeAscii}\n\n`;
                    }
                    
                    rowIndex++;
                    baseTick += Math.floor(Math.random() * 800) + 100;
                }
            }
            
            if (csvRows.length > 0) {
                csvContent = csvRows.join('\r\n'); // Monitor bevorzugt CRLF
                preview.innerHTML = previewText;
            }
        }

        // Download als 8-Bit Datei
        downloadBtn.addEventListener('click', () => {
            if (!csvContent) return;
            
            const bytes = new Uint8Array(csvContent.length);
            for(let i = 0; i < csvContent.length; i++) {
                bytes[i] = csvContent.charCodeAt(i) & 0xFF; // Schneidet auf 8-Bit ANSI ab
            }
            
            const blob = new Blob([bytes], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            let baseName = originalFileName.replace(/\.[^/.]+$/, "");
            if (baseName === "") baseName = "export";
            
            link.setAttribute('href', url);
            link.setAttribute('download', baseName + '.PRO.CSV');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
